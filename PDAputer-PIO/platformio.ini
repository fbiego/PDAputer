; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-stamps3]
platform = espressif32@6.9.0                
board = m5stack-stamps3            
framework = arduino

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1 ; Enable USB CDC on boot for serial communication over USB
  -I include ; Add include directory to search path
  -W
  -std=gnu++17

build_unflags =
  -std=gnu++11

lib_deps =
  m5stack/M5Cardputer@^1.1.1
  lvgl=https://github.com/lvgl/lvgl#v9.5.0 ; 9.1.0
  https://github.com/pschatzmann/arduino-libhelix.git
  https://github.com/fbiego/ESPConfig

monitor_speed = 115200
extra_scripts = 
	scripts/build_firmware.py